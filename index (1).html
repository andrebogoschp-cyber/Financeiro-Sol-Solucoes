<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>SOL Financeiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f6ba8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1720" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOL Financeiro" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
</head>

<style>
  :root{
    --bg:#f4f7fa;
    --surface:#ffffff;
    --surface-2:#eef2f6;
    --border:#dde4ea;
    --text:#16232c;
    --text-muted:#5b6b78;
    --brand:#0f6ba8;
    --brand-deep:#0a4d7a;
    --brand-soft:#e3f0f8;
    --accent:#f2621e;
    --accent-soft:#fde9de;
    --accent-2:#ffc933;
    --good:#1f9d55;
    --good-bg:#e6f6ec;
    --bad:#d64545;
    --bad-bg:#fbe9e9;
    --shadow: 0 1px 2px rgba(16,40,60,.06), 0 8px 24px -12px rgba(16,40,60,.18);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a141d;
      --surface:#101f2b;
      --surface-2:#16283a;
      --border:#233648;
      --text:#eaf2f7;
      --text-muted:#93a9b9;
      --brand:#3ea3e0;
      --brand-deep:#1d6fa0;
      --brand-soft:#123049;
      --accent:#ff7d42;
      --accent-soft:#3a2416;
      --accent-2:#ffd166;
      --good:#3ecb7e;
      --good-bg:#0f2e1e;
      --bad:#ff6f6f;
      --bad-bg:#3a1616;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a141d;
    --surface:#101f2b;
    --surface-2:#16283a;
    --border:#233648;
    --text:#eaf2f7;
    --text-muted:#93a9b9;
    --brand:#3ea3e0;
    --brand-deep:#1d6fa0;
    --brand-soft:#123049;
    --accent:#ff7d42;
    --accent-soft:#3a2416;
    --accent-2:#ffd166;
    --good:#3ecb7e;
    --good-bg:#0f2e1e;
    --bad:#ff6f6f;
    --bad-bg:#3a1616;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.font-display{ font-family:'Sora', ui-sans-serif, system-ui, sans-serif; text-wrap:balance; }
  .num{ font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:var(--brand); }

  #shell{
    display:grid;
    grid-template-columns: 250px 1fr;
    min-height:100vh;
  }
  @media (max-width: 880px){
    #shell{ grid-template-columns: 1fr; }
  }

  /* ---- Sidebar (desktop) ---- */
  #sidebar{
    background:var(--brand-deep);
    color:#fff;
    padding:22px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
  }
  @media (max-width: 880px){ #sidebar{ display:none; } }
  .brand-row{
    display:flex; align-items:center; gap:10px;
    padding:4px 10px 22px;
  }
  .brand-row img{ width:38px; height:38px; border-radius:9px; display:block; }
  .brand-row .brand-name{ font-family:'Sora'; font-weight:800; font-size:15px; line-height:1.15; color:#fff; }
  .brand-row .brand-sub{ font-size:10.5px; color:#bfe0f5; letter-spacing:.04em; text-transform:uppercase; }

  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:11px 12px; border-radius:11px;
    background:transparent; border:none; text-align:left;
    color:#cfe6f4; font-size:14.5px; font-weight:600;
    transition:background .12s ease;
  }
  .nav-item .ic{ font-size:17px; width:20px; text-align:center; }
  .nav-item:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .nav-item.active{ background:#fff; color:var(--brand-deep); }
  .sidebar-spacer{ flex:1; }
  .install-hint{
    font-size:11.5px; color:#bfe0f5; background:rgba(255,255,255,.08);
    border-radius:10px; padding:10px 12px; line-height:1.5;
  }
  #install-btn{
    margin-top:8px; width:100%; padding:9px 10px; border-radius:10px;
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1);
    color:#fff; font-weight:700; font-size:12.5px; display:none;
  }
  #install-btn.show{ display:block; }

  /* ---- Mobile top bar ---- */
  #mobile-bar{
    display:none;
    align-items:center; gap:10px;
    padding:14px 16px;
    background:var(--brand-deep); color:#fff;
    position:sticky; top:0; z-index:20;
  }
  #mobile-bar img{ width:30px; height:30px; border-radius:8px; }
  #mobile-bar .brand-name{ font-family:'Sora'; font-weight:800; font-size:14.5px; }
  @media (max-width: 880px){ #mobile-bar{ display:flex; } }

  /* ---- Bottom tab bar (mobile) ---- */
  #bottom-nav{
    display:none;
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:30;
    box-shadow:0 -6px 18px -12px rgba(0,0,0,.25);
  }
  @media (max-width: 880px){ #bottom-nav{ display:flex; } }
  .bn-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:var(--text-muted); font-size:10.5px; font-weight:600;
    padding:6px 2px; border-radius:10px;
  }
  .bn-item .ic{ font-size:18px; }
  .bn-item.active{ color:var(--brand); }

  main{ padding:26px 30px 60px; max-width:1100px; width:100%; }
  @media (max-width: 880px){ main{ padding:18px 14px 90px; } }

  .view-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .view-header h1{ font-size:23px; font-weight:800; margin:0 0 3px; }
  .view-header p{ margin:0; color:var(--text-muted); font-size:13.5px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:11px; border:1px solid transparent;
    font-weight:700; font-size:13.5px; white-space:nowrap;
  }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-deep); }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-accent:hover{ filter:brightness(.94); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--border); }
  .btn-danger{ background:var(--bad); color:#fff; }
  .btn-danger:hover{ filter:brightness(.94); }
  .btn-sm{ padding:7px 11px; font-size:12.5px; border-radius:9px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
  }
  .pad{ padding:20px; }
  @media (max-width:880px){ .pad{ padding:16px; } }

  .month-switch{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:6px 6px 6px 14px;
  }
  .month-switch .label{ font-weight:700; font-size:14px; min-width:118px; text-align:center; text-transform:capitalize; }
  .month-switch button{ background:var(--surface-2); border:none; width:30px; height:30px; border-radius:8px; font-size:15px; font-weight:700; color:var(--text); }
  .month-switch button:hover{ background:var(--border); }

  .kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:720px){ .kpi-grid{ grid-template-columns:1fr; } }
  .kpi{ padding:18px 20px; }
  .kpi .kpi-label{ font-size:12px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:6px; }
  .kpi .kpi-value{ font-size:26px; font-weight:700; margin-top:8px; }
  .kpi.good .kpi-value{ color:var(--good); }
  .kpi.bad .kpi-value{ color:var(--bad); }
  .kpi .kpi-delta{ margin-top:6px; font-size:12px; font-weight:600; color:var(--text-muted); }

  .section-title{ font-family:'Sora'; font-weight:700; font-size:15.5px; margin:28px 0 12px; display:flex; align-items:center; gap:8px; }
  .section-title:first-child{ margin-top:0; }

  .row-list{ display:flex; flex-direction:column; gap:10px; }
  .tx-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; border-radius:14px; border:1px solid var(--border); background:var(--surface);
  }
  .tx-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .tx-dot.in{ background:var(--good); }
  .tx-dot.out{ background:var(--bad); }
  .tx-main{ flex:1; min-width:0; }
  .tx-condo{ font-weight:700; font-size:14px; }
  .tx-obs{ font-size:12.5px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-date{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .tx-value{ font-weight:700; font-size:15px; white-space:nowrap; }
  .tx-value.in{ color:var(--good); }
  .tx-value.out{ color:var(--bad); }
  .tx-del{ background:none; border:none; color:var(--text-muted); font-size:16px; padding:6px; border-radius:8px; flex-shrink:0; }
  .tx-del:hover{ color:var(--bad); background:var(--bad-bg); }
  .tx-att{ background:none; border:none; color:var(--text-muted); font-size:15px; padding:6px; border-radius:8px; flex-shrink:0; }
  .tx-att:hover{ color:var(--brand); background:var(--brand-soft); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state .ic{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; max-width:340px; margin:6px auto 0; }

  .filters-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; align-items:center; }
  select, .text-input{
    padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:13.5px; font-weight:500;
  }
  select:focus, .text-input:focus, input:focus, textarea:focus{ outline:2px solid var(--brand); outline-offset:1px; }

  .condo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .condo-card{
    text-align:left; padding:16px 16px; border-radius:14px; border:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; gap:8px;
  }
  .condo-card:hover{ border-color:var(--brand); }
  .condo-card .cname{ font-weight:700; font-size:14.5px; }
  .condo-card .cstat{ display:flex; justify-content:space-between; font-size:12px; }
  .condo-card .cstat .v.good{ color:var(--good); font-weight:700; }
  .condo-card .cstat .v.bad{ color:var(--bad); font-weight:700; }
  .condo-card .csaldo{ font-size:12.5px; color:var(--text-muted); border-top:1px dashed var(--border); padding-top:8px; margin-top:2px; }
  .badge-inactive{ display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); background:var(--surface-2); padding:2px 8px; border-radius:20px; margin-left:6px; }

  .insight-card{ padding:18px 20px; display:flex; gap:14px; align-items:flex-start; }
  .insight-card .ic{ font-size:22px; flex-shrink:0; }
  .insight-card .txt strong{ display:block; font-size:14px; margin-bottom:3px; }
  .insight-card .txt span{ font-size:13px; color:var(--text-muted); line-height:1.5; }
  .insight-card.warn{ border-color:var(--accent); background:var(--accent-soft); }
  .insight-card.good{ border-color:var(--good); background:var(--good-bg); }

  /* ---- Modal ---- */
  #modal-backdrop{
    position:fixed; inset:0; background:rgba(6,16,24,.55); backdrop-filter:blur(2px);
    display:none; align-items:flex-end; justify-content:center; z-index:100; padding:0;
  }
  #modal-backdrop.open{ display:flex; }
  @media (min-width:640px){ #modal-backdrop{ align-items:center; padding:20px; } }
  #modal-box{
    background:var(--surface); width:100%; max-width:440px; border-radius:20px 20px 0 0;
    padding:22px 22px calc(20px + env(safe-area-inset-bottom)); box-shadow:var(--shadow);
    max-height:88vh; overflow-y:auto;
  }
  @media (min-width:640px){ #modal-box{ border-radius:18px; } }
  #modal-box h3{ margin:0 0 4px; font-size:17px; }
  #modal-box .modal-sub{ font-size:13px; color:var(--text-muted); margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field select, .field textarea{ width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:15px; }
  .att-picker{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .att-thumb{ width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--border); display:block; }
  .att-view-img{ width:100%; border-radius:12px; display:block; margin-bottom:6px; }
  .att-status{ font-size:12.5px; color:var(--text-muted); }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions .btn{ flex:1; justify-content:center; }
  .confirm-msg{ font-size:14px; line-height:1.55; color:var(--text); margin-bottom:2px; }
  .confirm-warn{ font-size:12.5px; color:var(--bad); margin-top:8px; font-weight:600; }
  .inline-add-condo{ display:flex; gap:8px; }
  .inline-add-condo select{ flex:1; }

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:200; box-shadow:var(--shadow);
    max-width:88vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:880px){ #toast{ bottom:78px; } }

  .search-header{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{ background:var(--surface-2); border:1px solid var(--border); width:34px; height:34px; border-radius:10px; font-size:16px; }
  .trend-mini{ display:flex; gap:6px; align-items:flex-end; height:54px; margin-top:4px; }
  .trend-mini .bar{ flex:1; border-radius:4px 4px 0 0; min-height:3px; position:relative; }
  .trend-bars-wrap{ display:flex; gap:14px; }
  .trend-col{ flex:1; }
  .trend-col .tlabel{ font-size:10.5px; color:var(--text-muted); text-align:center; margin-top:5px; }

  /* ---- Dashboard ---- */
  .seg-toggle{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; }
  .seg-toggle button{ background:none; border:none; padding:6px 13px; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--text-muted); }
  .seg-toggle button.active{ background:var(--brand); color:#fff; }
  .dash-legend{ display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-bottom:14px; font-size:12.5px; font-weight:600; color:var(--text-muted); }
  .dash-legend .sw{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px; }
  .dash-legend .sw.line{ width:14px; height:3px; border-radius:2px; vertical-align:2px; }
  .dash-chart-wrap{ width:100%; overflow-x:auto; }
  .dash-chart-wrap svg{ display:block; width:100%; height:auto; min-width:520px; }
  .dash-axis-label{ font-size:9.5px; fill:var(--text-muted); font-family:'Inter', sans-serif; }
  .dash-month-row{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:14px; border:1px solid var(--border); background:var(--surface); }
  .dash-month-row .dmr-label{ font-weight:700; font-size:13.5px; width:64px; flex-shrink:0; text-transform:capitalize; }
  .dash-month-row .dmr-vals{ flex:1; display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted); }
  .dash-month-row .dmr-vals b{ color:var(--text); font-weight:700; }
  .dash-month-row .dmr-saldo{ font-weight:700; font-size:14px; white-space:nowrap; }
  @media (max-width:600px){ .dash-month-row{ flex-wrap:wrap; } .dash-month-row .dmr-label{ width:auto; } }
</style>

<body>
  <div id="shell">
    <aside id="sidebar">
      <div class="brand-row">
        <img src="icon-192.png" alt="SOL" />
        <div>
          <div class="brand-name">SOL Soluções</div>
          <div class="brand-sub">Financeiro</div>
        </div>
      </div>
      <nav id="nav-desktop"></nav>
      <div class="sidebar-spacer"></div>
      <button id="install-btn" onclick="triggerInstall()">📲 Instalar aplicativo</button>
      <div class="install-hint">No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início" para instalar.</div>
    </aside>

    <div>
      <div id="mobile-bar">
        <img src="icon-192.png" alt="SOL" />
        <div class="brand-name">SOL Financeiro</div>
      </div>
      <main id="view-root"></main>
    </div>
  </div>

  <nav id="bottom-nav"></nav>

  <div id="modal-backdrop"><div id="modal-box"></div></div>
  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    var firebaseConfig = {
      apiKey: "AIzaSyB_IFUHLvUuG9kdALEgLYKUkt8GhSaH0KQ",
      authDomain: "financeiro-sol-solucoes.firebaseapp.com",
      projectId: "financeiro-sol-solucoes",
      storageBucket: "financeiro-sol-solucoes.firebasestorage.app",
      messagingSenderId: "27064986906",
      appId: "1:27064986906:web:ecfb1b6dd8e68c250650a3"
    };
    var fbApp = initializeApp(firebaseConfig);
    var db = getFirestore(fbApp);
    var stateDocRef = doc(db, "solfinanceiro", "estado");

    window.__firestore = { doc: doc, getDoc: getDoc, setDoc: setDoc, deleteDoc: deleteDoc, onSnapshot: onSnapshot, db: db, stateDocRef: stateDocRef };
  </script>

  <script>
  (function(){
    "use strict";

    var DEFAULT_CONDOMINIOS = [
      "Portal dos Nobres","Serra da Estrela","Buona Vita I e II","Elevatoria Buona",
      "Elevatoria Terras I","Terras I","Terras II","Portal das Rosas","Recanto dos Palmares",
      "Bonanza","Ikebana","Clube da Montanha/Melhoramento Rurais de Atibaia","Santa Maria","Solar",
      "Alto do Sion","Itaporã","Alto da Floresta","Ybyra","Amart/ Recanto Tranquilo",
      "Figueira Garden/Arefi","La Reserva I","La Reserva II","Portal Lamis","Terra Nova",
      "Hotel Campestre","São Nicolau/ Nossa Senhora do Sion","Elementum","Barone I","GPK/LNR",
      "Figueira Mall","Shambala I","Ype Amarelo - Escola","Bosque dos Palmares","Fabrica de Sorvete"
    ];

    /* ---------- state (carregado do Firestore, com sincronização em tempo real) ---------- */
    var state = {condominios:[], entradas:[], saidas:[]};
    var stateLoaded = false;
    var view = 'resumo';
    var condoDetailId = null;
    var filters = {
      entradasMonth: currentMonthKey(),
      entradasCondo: 'all',
      saidasMonth: currentMonthKey(),
      saidasCondo: 'all',
      resumoMonth: currentMonthKey(),
      detailMonth: currentMonthKey(),
      showArchived: false,
      condoSearch: '',
      dashboardMonths: 12
    };

    var NAV_ITEMS = [
      {id:'resumo', label:'Resumo', ic:'📊'},
      {id:'dashboard', label:'Dashboard', ic:'📈'},
      {id:'entradas', label:'Entradas', ic:'⬆️'},
      {id:'saidas', label:'Saídas', ic:'⬇️'},
      {id:'condominios', label:'Condomínios', ic:'🏢'},
      {id:'sugestoes', label:'Sugestões', ic:'💭'}
    ];

    /* ---------- helpers ---------- */
    function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
    function currentMonthKey(){ var d=new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
    function monthKeyOf(dateStr){ return (dateStr||'').slice(0,7); }
    function addMonths(key, delta){
      var parts = key.split('-'); var y=parseInt(parts[0],10), m=parseInt(parts[1],10)-1;
      var d = new Date(y, m+delta, 1);
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }
    var MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    function monthLabel(key){
      var parts = key.split('-'); var m = parseInt(parts[1],10)-1;
      return MONTH_NAMES[m] + ' de ' + parts[0];
    }
    function monthLabelShort(key){
      var parts = key.split('-'); var m = parseInt(parts[1],10)-1;
      return MONTH_NAMES[m].slice(0,3) + '/' + parts[0].slice(2);
    }
    var currencyFmt = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
    function fmtMoney(v){ return currencyFmt.format(v||0); }
    function fmtDateShort(iso){
      if(!iso) return '';
      var p = iso.split('-'); return p[2] + '/' + p[1];
    }
    function fmtDateFull(iso){
      if(!iso) return '';
      var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0];
    }
    function todayISO(){
      var d = new Date();
      var tz = d.getTimezoneOffset();
      d.setMinutes(d.getMinutes()-tz);
      return d.toISOString().slice(0,10);
    }
    function esc(s){
      return String(s==null?'':s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function activeCondos(){ return state.condominios.filter(function(c){ return c.ativo; }); }
    function condoById(id){ return state.condominios.find(function(c){ return c.id===id; }); }
    function condoName(id){ var c = condoById(id); return c ? c.nome : '(condomínio removido)'; }
    function condoHasTx(id){
      return state.entradas.some(function(e){ return e.condominioId===id; }) ||
             state.saidas.some(function(s){ return s.condominioId===id; });
    }

    function totalsForMonth(monthKey, condoId){
      var ins = state.entradas.filter(function(e){ return monthKeyOf(e.data)===monthKey && (!condoId || e.condominioId===condoId); });
      var outs = state.saidas.filter(function(s){ return monthKeyOf(s.data)===monthKey && (!condoId || s.condominioId===condoId); });
      var totalIn = ins.reduce(function(a,e){ return a+e.valor; },0);
      var totalOut = outs.reduce(function(a,s){ return a+s.valor; },0);
      return { totalIn:totalIn, totalOut:totalOut, saldo: totalIn-totalOut, ins:ins, outs:outs };
    }

    /* ---------- persistence (Firestore: sincroniza em tempo real entre todos os aparelhos) ---------- */
    var saving = false;
    var suppressNextSnapshot = false;
    function persist(){
      renderAll();
      doSave();
    }
    function doSave(){
      var fs = window.__firestore;
      if(!fs){ showToast('Sem conexão com o banco de dados agora. Tente novamente em instantes.'); return; }
      saving = true;
      suppressNextSnapshot = true;
      fs.setDoc(fs.stateDocRef, state).then(function(){
        saving = false;
      }).catch(function(err){
        saving = false;
        showToast('Não foi possível sincronizar agora. Verifique sua internet e tente de novo.');
        console.error('Erro ao salvar no Firestore:', err);
      });
    }

    /* ---------- comprovantes (fotos anexadas, guardadas em documentos separados no Firestore) ---------- */
    function compressImageFile(file, maxDim, quality){
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onerror = function(){ reject(new Error('Erro ao ler o arquivo')); };
        reader.onload = function(){
          var img = new Image();
          img.onerror = function(){ reject(new Error('Não foi possível abrir essa imagem')); };
          img.onload = function(){
            var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            var scale = Math.min(1, maxDim / Math.max(w, h));
            var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            try{
              resolve(canvas.toDataURL('image/jpeg', quality));
            }catch(e){ reject(e); }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function uploadComprovante(dataUrl){
      var fs = window.__firestore;
      if(!fs) return Promise.reject(new Error('Sem conexão com o banco de dados'));
      var id = uid();
      return fs.setDoc(fs.doc(fs.db, 'solfinanceiro_comprovantes', id), {
        data: dataUrl, criadoEm: new Date().toISOString()
      }).then(function(){ return id; });
    }
    function deleteComprovante(id){
      var fs = window.__firestore;
      if(!fs || !id) return;
      fs.deleteDoc(fs.doc(fs.db, 'solfinanceiro_comprovantes', id)).catch(function(err){
        console.error('Erro ao remover comprovante antigo:', err);
      });
    }
    function viewComprovante(id){
      openModalHtml('<h3>Comprovante</h3><p class="att-status" id="att-view-status">Carregando...</p>');
      var fs = window.__firestore;
      if(!fs){
        document.getElementById('att-view-status').textContent = 'Sem conexão com o banco de dados agora.';
        return;
      }
      fs.getDoc(fs.doc(fs.db, 'solfinanceiro_comprovantes', id)).then(function(snap){
        if(!snap.exists()){
          openModalHtml('<h3>Comprovante</h3><p class="confirm-msg">Não foi possível encontrar esse comprovante.</p><div class="modal-actions"><button class="btn btn-ghost" id="att-close">Fechar</button></div>');
          document.getElementById('att-close').onclick = closeModal;
          return;
        }
        var img = snap.data().data;
        openModalHtml('<h3>Comprovante</h3><img class="att-view-img" src="'+img+'" alt="Comprovante" /><div class="modal-actions"><button class="btn btn-ghost" id="att-close">Fechar</button></div>');
        document.getElementById('att-close').onclick = closeModal;
      }).catch(function(err){
        console.error('Erro ao carregar comprovante:', err);
        openModalHtml('<h3>Comprovante</h3><p class="confirm-msg">Não foi possível carregar o comprovante agora. Verifique sua internet.</p><div class="modal-actions"><button class="btn btn-ghost" id="att-close">Fechar</button></div>');
        document.getElementById('att-close').onclick = closeModal;
      });
    }

    /* ---------- toast ---------- */
    var toastTimer = null;
    function showToast(msg){
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2800);
    }

    /* ---------- modal / confirm ---------- */
    function closeModal(){
      document.getElementById('modal-backdrop').classList.remove('open');
      document.getElementById('modal-box').innerHTML = '';
    }
    function openModalHtml(html){
      document.getElementById('modal-box').innerHTML = html;
      document.getElementById('modal-backdrop').classList.add('open');
    }
    document.getElementById('modal-backdrop').addEventListener('click', function(e){
      if(e.target.id === 'modal-backdrop') closeModal();
    });

    function confirmAction(opts){
      var title = esc(opts.title || 'Confirmar ação');
      var message = opts.message || '';
      var confirmLabel = esc(opts.confirmLabel || 'Confirmar');
      var danger = !!opts.danger;
      var extraWarn = opts.warn ? '<div class="confirm-warn">⚠️ ' + esc(opts.warn) + '</div>' : '';
      openModalHtml(
        '<h3>' + title + '</h3>' +
        '<p class="confirm-msg">' + message + '</p>' +
        extraWarn +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="cf-cancel">Cancelar</button>' +
          '<button class="btn ' + (danger?'btn-danger':'btn-primary') + '" id="cf-ok">' + confirmLabel + '</button>' +
        '</div>'
      );
      document.getElementById('cf-cancel').onclick = function(){ closeModal(); if(opts.onCancel) opts.onCancel(); };
      document.getElementById('cf-ok').onclick = function(){ closeModal(); opts.onConfirm && opts.onConfirm(); };
    }

    /* ---------- money mask ---------- */
    function attachMoneyMask(input, initialCents){
      input.dataset.cents = String(initialCents||0);
      input.value = fmtMoney((initialCents||0)/100);
      input.addEventListener('input', function(){
        var digits = input.value.replace(/\D/g,'');
        digits = digits.replace(/^0+(?=\d)/,'');
        if(!digits) digits = '0';
        input.dataset.cents = digits;
        input.value = fmtMoney(parseInt(digits,10)/100);
        input.setSelectionRange(input.value.length, input.value.length);
      });
    }
    function moneyValue(input){ return parseInt(input.dataset.cents||'0',10)/100; }

    /* ---------- condo select builder ---------- */
    function condoOptionsHtml(selectedId){
      var opts = activeCondos().map(function(c){
        return '<option value="'+esc(c.id)+'"'+(c.id===selectedId?' selected':'')+'>'+esc(c.nome)+'</option>';
      }).join('');
      if(!opts) opts = '<option value="">Nenhum condomínio cadastrado</option>';
      return opts;
    }

    /* ---------- forms: lançamento ---------- */
    function openLancamentoForm(tipo, editing){
      var isIn = tipo === 'entrada';
      var title = editing ? ('Editar ' + tipo) : (isIn ? 'Nova entrada' : 'Nova saída');
      if(activeCondos().length === 0){
        openModalHtml(
          '<h3>Cadastre um condomínio primeiro</h3>' +
          '<p class="confirm-msg">Para lançar uma ' + tipo + ' você precisa ter pelo menos um condomínio cadastrado.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" id="cf-cancel2">Fechar</button>' +
            '<button class="btn btn-primary" id="go-condo">Adicionar condomínio</button>' +
          '</div>'
        );
        document.getElementById('cf-cancel2').onclick = closeModal;
        document.getElementById('go-condo').onclick = function(){ closeModal(); goView('condominios'); setTimeout(openAddCondoForm, 50); };
        return;
      }
      var d = editing || {};
      // estado local do anexo enquanto o formulário está aberto
      var attState = { pendingFile: null, previewUrl: null, existingId: d.comprovanteId || null, remove: false };

      openModalHtml(
        '<h3>' + esc(title) + '</h3>' +
        '<p class="modal-sub">Preencha os dados abaixo. Você vai confirmar antes de salvar.</p>' +
        '<div class="field"><label>Valor</label><input id="f-valor" inputmode="decimal" /></div>' +
        '<div class="field"><label>Condomínio</label>' +
          '<div class="inline-add-condo">' +
            '<select id="f-condo">'+condoOptionsHtml(d.condominioId)+'</select>' +
            '<button class="btn btn-ghost btn-sm" id="f-add-condo" type="button">+ Novo</button>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label>Data</label><input id="f-data" type="date" value="'+esc(d.data||todayISO())+'" /></div>' +
        '<div class="field"><label>Observação ('+ (isIn?'recebimento':'saída') +', opcional)</label><textarea id="f-obs" placeholder="Ex: '+(isIn?'Valor contrato mensal':'Compra de materiais para o condomínio')+'">'+esc(d.obs||'')+'</textarea></div>' +
        '<div class="field"><label>Comprovante (opcional)</label>' +
          '<div class="att-picker" id="att-picker"></div>' +
          '<input type="file" id="f-att-input" accept="image/*" style="display:none;" />' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="f-cancel">Cancelar</button>' +
          '<button class="btn ' + (isIn?'btn-primary':'btn-accent') + '" id="f-save">Salvar</button>' +
        '</div>'
      );
      var valorInput = document.getElementById('f-valor');
      attachMoneyMask(valorInput, Math.round((d.valor||0)*100));
      document.getElementById('f-cancel').onclick = closeModal;
      document.getElementById('f-add-condo').onclick = function(){ openAddCondoForm(true); };

      function renderAttPicker(){
        var wrap = document.getElementById('att-picker');
        if(!wrap) return;
        if(attState.previewUrl){
          wrap.innerHTML =
            '<img class="att-thumb" src="'+attState.previewUrl+'" alt="Pré-visualização do comprovante" />' +
            '<button type="button" class="btn btn-ghost btn-sm" id="f-att-change">Trocar</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="f-att-remove">Remover</button>';
        } else if(attState.existingId && !attState.remove){
          wrap.innerHTML =
            '<span class="att-status">📎 Comprovante já anexado</span>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="f-att-change">Trocar</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="f-att-remove">Remover</button>';
        } else {
          wrap.innerHTML =
            '<span class="att-status">Nenhum comprovante</span>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="f-att-change">📎 Escolher foto</button>';
        }
        var changeBtn = document.getElementById('f-att-change');
        var removeBtn = document.getElementById('f-att-remove');
        if(changeBtn) changeBtn.onclick = function(){ document.getElementById('f-att-input').click(); };
        if(removeBtn) removeBtn.onclick = function(){
          attState.pendingFile = null;
          if(attState.previewUrl) URL.revokeObjectURL(attState.previewUrl);
          attState.previewUrl = null;
          attState.remove = true;
          renderAttPicker();
        };
      }
      renderAttPicker();
      document.getElementById('f-att-input').addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        if(!/^image\//.test(file.type)){ showToast('Escolha um arquivo de imagem.'); return; }
        if(attState.previewUrl) URL.revokeObjectURL(attState.previewUrl);
        attState.pendingFile = file;
        attState.previewUrl = URL.createObjectURL(file);
        attState.remove = false;
        renderAttPicker();
      });

      document.getElementById('f-save').onclick = function(){
        var valor = moneyValue(valorInput);
        var condominioId = document.getElementById('f-condo').value;
        var data = document.getElementById('f-data').value || todayISO();
        var obs = document.getElementById('f-obs').value.trim();
        if(!condominioId){ showToast('Selecione um condomínio.'); return; }
        if(valor <= 0){ showToast('Informe um valor maior que zero.'); return; }
        var cname = condoName(condominioId);
        var attNote = (attState.pendingFile || (attState.existingId && !attState.remove)) ? '<br>📎 Com comprovante anexado' : '';
        closeModal();
        confirmAction({
          title: 'Deseja ' + (editing?'salvar':'lançar') + ' esta ' + tipo + '?',
          message: '<strong class="num">'+fmtMoney(valor)+'</strong> — ' + esc(cname) + '<br>Data: ' + fmtDateFull(data) + (obs? '<br>Obs: '+esc(obs) : '') + attNote,
          confirmLabel: 'Confirmar',
          onConfirm: function(){
            function applyAndSave(comprovanteId){
              if(editing){
                var arr = isIn ? state.entradas : state.saidas;
                var item = arr.find(function(x){ return x.id===editing.id; });
                if(item){
                  item.valor=valor; item.condominioId=condominioId; item.data=data; item.obs=obs;
                  if(comprovanteId) item.comprovanteId=comprovanteId; else delete item.comprovanteId;
                }
              } else {
                var novo = {id:uid(), valor:valor, condominioId:condominioId, data:data, obs:obs, criadoEm:new Date().toISOString()};
                if(comprovanteId) novo.comprovanteId = comprovanteId;
                (isIn ? state.entradas : state.saidas).push(novo);
              }
              persist();
              showToast((isIn?'Entrada':'Saída') + ' salva com sucesso.');
            }
            var oldId = attState.existingId;
            if(attState.pendingFile){
              showToast('Salvando comprovante...');
              compressImageFile(attState.pendingFile, 1280, 0.62).then(function(dataUrl){
                return uploadComprovante(dataUrl);
              }).then(function(newId){
                applyAndSave(newId);
                if(oldId && oldId !== newId) deleteComprovante(oldId);
              }).catch(function(err){
                console.error('Erro ao salvar comprovante:', err);
                showToast('Não foi possível salvar o comprovante, mas o lançamento será salvo sem ele.');
                applyAndSave(null);
              });
            } else if(attState.remove){
              applyAndSave(null);
              if(oldId) deleteComprovante(oldId);
            } else {
              applyAndSave(oldId || null);
            }
          }
        });
      };
    }

    function deleteLancamento(tipo, id){
      var isIn = tipo === 'entrada';
      var arr = isIn ? state.entradas : state.saidas;
      var item = arr.find(function(x){ return x.id===id; });
      if(!item) return;
      confirmAction({
        title: 'Excluir ' + tipo + '?',
        message: 'Deseja excluir a ' + tipo + ' de <strong class="num">'+fmtMoney(item.valor)+'</strong> — ' + esc(condoName(item.condominioId)) + ' (' + fmtDateFull(item.data) + ')?',
        confirmLabel: 'Excluir',
        danger: true,
        warn: 'Essa ação não pode ser desfeita.',
        onConfirm: function(){
          var idx = arr.indexOf(item);
          arr.splice(idx,1);
          persist();
          showToast((isIn?'Entrada':'Saída') + ' excluída.');
        }
      });
    }

    /* ---------- condomínios: add / remove ---------- */
    function openAddCondoForm(fromLancamento){
      openModalHtml(
        '<h3>Adicionar condomínio</h3>' +
        '<p class="modal-sub">Ele ficará disponível para novos lançamentos.</p>' +
        '<div class="field"><label>Nome do condomínio</label><input id="f-cname" class="text-input" style="width:100%" placeholder="Ex: Figueira Garden" /></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="f-cancel">Cancelar</button>' +

    function removeCondo(id){
      var c = condoById(id);
      if(!c) return;
      var hasTx = condoHasTx(id);
      if(hasTx){
        confirmAction({
          title: 'Remover "' + esc(c.nome) + '"?',
          message: 'Esse condomínio já possui lançamentos registrados. Para não perder o seu histórico financeiro, ele será <strong>arquivado</strong>: some da lista de seleção de novos lançamentos, mas os valores já lançados continuam contando nos seus relatórios.',
          confirmLabel: 'Arquivar condomínio',
          danger: true,
          warn: 'Essa ação não pode ser desfeita por aqui — para reativar, adicione um novo condomínio com o mesmo nome.',
          onConfirm: function(){
            c.ativo = false;
            persist();
            showToast('Condomínio arquivado.');
            if(condoDetailId === id){ condoDetailId = null; }
            renderAll();
          }
        });
      } else {
        confirmAction({
          title: 'Excluir "' + esc(c.nome) + '"?',
          message: 'Esse condomínio ainda não tem nenhum lançamento, então ele será excluído definitivamente.',
          confirmLabel: 'Excluir',
          danger: true,
          warn: 'Essa ação não pode ser desfeita.',
          onConfirm: function(){
            state.condominios = state.condominios.filter(function(x){ return x.id!==id; });
            persist();
            showToast('Condomínio excluído.');
            if(condoDetailId === id){ condoDetailId = null; }
            renderAll();
          }
        });
      }
    }

    /* ---------- rendering: shared bits ---------- */
    function monthSwitcher(key, onChange){
      return '<div class="month-switch">' +
        '<button data-mm-prev>‹</button>' +
        '<span class="label">' + esc(monthLabel(key)) + '</span>' +
        '<button data-mm-next>›</button>' +
        '</div>';
    }
    function wireMonthSwitch(container, key, setKey){
      var prev = container.querySelector('[data-mm-prev]');
      var next = container.querySelector('[data-mm-next]');
      if(prev) prev.onclick = function(){ setKey(addMonths(key,-1)); renderAll(); };
      if(next) next.onclick = function(){ setKey(addMonths(key,1)); renderAll(); };
    }

    function txRowHtml(tx, tipo){

        '<span class="tx-dot ' + (isIn?'in':'out') + '"></span>' +

    /* ---------- view: resumo ---------- */
    function renderResumo(root){
      var key = filters.resumoMonth;
      var t = totalsForMonth(key);
      var prevKey = addMonths(key,-1);
      var tPrev = totalsForMonth(prevKey);
      function delta(cur, prev){
        if(prev===0) return cur>0 ? 'novo neste mês' : 'sem variação';
        var pct = ((cur-prev)/Math.abs(prev))*100;
        var arrow = pct>=0 ? '▲' : '▼';
        return arrow + ' ' + Math.abs(pct).toFixed(0) + '% vs ' + monthLabelShort(prevKey);
      }
      var ranking = activeCondos().map(function(c){
        var tc = totalsForMonth(key, c.id);
        return {c:c, t:tc};
      }).filter(function(r){ return r.t.totalIn>0 || r.t.totalOut>0; })
        .sort(function(a,b){ return b.t.saldo - a.t.saldo; });

      var recentes = state.entradas.map(function(e){ return Object.assign({tipo:'entrada'}, e); })

              '<div class="tx-obs">Recebido '+fmtMoney(r.t.totalIn)+' · Gasto '+fmtMoney(r.t.totalOut)+'</div></div>' +

    /* ---------- view: dashboard (gráfico comparativo mês a mês) ---------- */
    function fmtMoneyShort(v){
      var n = Math.abs(v||0);
      var sign = v<0 ? '-' : '';
      if(n>=1000000) return sign+'R$ '+(n/1000000).toFixed(1).replace('.',',')+'mi';
      if(n>=1000) return sign+'R$ '+(n/1000).toFixed(1).replace('.',',')+'mil';
      return sign+'R$ '+n.toFixed(0);
    }

    function dashboardSeries(months){
      var out = [];
      for(var i=months-1;i>=0;i--){
        var k = addMonths(currentMonthKey(), -i);
        var t = totalsForMonth(k);
        out.push({k:k, totalIn:t.totalIn, totalOut:t.totalOut, saldo:t.saldo});
      }
      return out;
    }

    function roundedTopBarPath(x, yTop, w, h, r){
      if(h<=0) return '';
      r = Math.max(0, Math.min(r, w/2, h));
      var yBottom = yTop+h;
      return 'M'+x+','+yBottom+
        ' L'+x+','+(yTop+r)+
        ' Q'+x+','+yTop+' '+(x+r)+','+yTop+
        ' L'+(x+w-r)+','+yTop+
        ' Q'+(x+w)+','+yTop+' '+(x+w)+','+(yTop+r)+
        ' L'+(x+w)+','+yBottom+' Z';
    }

    function buildDashboardChartSvg(series){
      var W = 900, H = 300;
      var padL = 12, padR = 12, padT = 14, padB = 26;
      var plotW = W-padL-padR, plotH = H-padT-padB;
      var n = series.length;
      var groupW = plotW/n;

      var maxPos = 1, minNeg = 0;
      series.forEach(function(s){
        maxPos = Math.max(maxPos, s.totalIn, s.totalOut, s.saldo);
        minNeg = Math.min(minNeg, s.saldo);
      });
      var yMax = maxPos*1.18;
      var yMin = minNeg===0 ? 0 : minNeg*1.18;
      var range = (yMax-yMin) || 1;
      function scaleY(v){ return padT + plotH - ((v-yMin)/range)*plotH; }
      var y0 = scaleY(0);

      var barW = Math.min(20, groupW*0.30);
      var gap = 3;

      var bars = '';
      var lineParts = [];
      var labels = '';
      series.forEach(function(s, i){
        var gx = padL + i*groupW + groupW/2;
        if(s.totalIn>0){
          var hIn = y0-scaleY(s.totalIn);
          bars += '<path d="'+roundedTopBarPath(gx-gap/2-barW, scaleY(s.totalIn), barW, hIn, 4)+'" fill="var(--good)"><title>'+esc(monthLabel(s.k))+' · Recebido '+esc(fmtMoney(s.totalIn))+'</title></path>';
        }
        if(s.totalOut>0){
          var hOut = y0-scaleY(s.totalOut);
          bars += '<path d="'+roundedTopBarPath(gx+gap/2, scaleY(s.totalOut), barW, hOut, 4)+'" fill="var(--bad)"><title>'+esc(monthLabel(s.k))+' · Gasto '+esc(fmtMoney(s.totalOut))+'</title></path>';
        }
        lineParts.push({x:gx, y:scaleY(s.saldo), v:s.saldo, k:s.k});
        labels += '<text class="dash-axis-label" x="'+gx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(monthLabelShort(s.k))+'</text>';
      });

      var poly = lineParts.map(function(p){ return p.x+','+p.y; }).join(' ');
      var dots = lineParts.map(function(p){
        return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--brand)" stroke="var(--surface)" stroke-width="1.5"><title>'+esc(monthLabel(p.k))+' · Saldo '+esc(fmtMoney(p.v))+'</title></circle>';
      }).join('');

      var zeroLine = (yMin<0) ? '<line x1="'+padL+'" y1="'+y0+'" x2="'+(W-padR)+'" y2="'+y0+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>' : '';

      return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Gráfico comparativo de entradas, saídas e saldo por mês">' +
        '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--border)" stroke-width="1"/>' +
        zeroLine +
        bars +
        '<polyline points="'+poly+'" fill="none" stroke="var(--brand)" stroke-width="2"/>' +
        dots +
        labels +
      '</svg>';
    }

    function renderDashboard(root){
      var months = filters.dashboardMonths || 12;
      var series = dashboardSeries(months);
      var totIn = series.reduce(function(a,s){ return a+s.totalIn; },0);
      var totOut = series.reduce(function(a,s){ return a+s.totalOut; },0);
      var totSaldo = totIn-totOut;
      var periodoLabel = monthLabelShort(series[0].k)+' – '+monthLabelShort(series[series.length-1].k);

      root.innerHTML =
        '<div class="view-header">' +
          '<div><h1>Dashboard</h1><p>Comparativo de recebimentos e gastos, mês a mês.</p></div>' +
          '<div class="seg-toggle" id="dash-toggle">' +
            '<button data-m="6" class="'+(months===6?'active':'')+'">6 meses</button>' +
            '<button data-m="12" class="'+(months===12?'active':'')+'">12 meses</button>' +
          '</div>' +
        '</div>' +
        '<div class="kpi-grid">' +
          '<div class="card kpi good"><div class="kpi-label">⬆️ Recebido no período</div><div class="kpi-value num">'+fmtMoney(totIn)+'</div></div>' +
          '<div class="card kpi bad"><div class="kpi-label">⬇️ Gasto no período</div><div class="kpi-value num">'+fmtMoney(totOut)+'</div></div>' +
          '<div class="card kpi '+(totSaldo>=0?'good':'bad')+'"><div class="kpi-label">💰 Saldo do período</div><div class="kpi-value num">'+fmtMoney(totSaldo)+'</div></div>' +
        '</div>' +
        '<div class="section-title">📈 '+esc(periodoLabel)+'</div>' +
        '<div class="card pad">' +
          '<div class="dash-legend">' +
            '<span><span class="sw" style="background:var(--good);"></span>Entradas</span>' +
            '<span><span class="sw" style="background:var(--bad);"></span>Saídas</span>' +
            '<span><span class="sw line" style="background:var(--brand);"></span>Saldo</span>' +
          '</div>' +
          '<div class="dash-chart-wrap">' + buildDashboardChartSvg(series) + '</div>' +
        '</div>' +
        '<div class="section-title">🧾 Detalhado por mês</div>' +
        '<div class="row-list">' + series.slice().reverse().map(function(s){
          return '<div class="dash-month-row">' +
            '<div class="dmr-label">'+esc(monthLabelShort(s.k))+'</div>' +
            '<div class="dmr-vals"><span>Recebido <b class="num">'+fmtMoney(s.totalIn)+'</b></span><span>Gasto <b class="num">'+fmtMoney(s.totalOut)+'</b></span></div>' +
            '<div class="dmr-saldo num" style="color:'+(s.saldo>=0?'var(--good)':'var(--bad)')+';">'+fmtMoney(s.saldo)+'</div>' +
          '</div>';
        }).join('') + '</div>';

      root.querySelectorAll('#dash-toggle [data-m]').forEach(function(btn){
        btn.onclick = function(){ filters.dashboardMonths = parseInt(btn.dataset.m,10); renderAll(); };
      });
    }

    /* ---------- view: entradas / saidas ---------- */

          '<div><h1>'+(isIn?'Entradas':'Saídas')+'</h1><p>'+(isIn?'Todo dinheiro recebido, por nota fiscal ou contrato.':'Todas as despesas lançadas por condomínio.')+'</p></div>' +
          '<button class="btn ' + (isIn?'btn-primary':'btn-accent') + '" id="add-lanc">+ Nova '+tipo+'</button>' +

        '</div>' +
        (arr.length ?
          '<div class="row-list">' + arr.map(function(x){ return txRowHtml(x, tipo); }).join('') + '</div>'

        '</div>' +
        '<div class="filters-row">' +

          '<label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);font-weight:600;"><input type="checkbox" id="show-archived" '+(filters.showArchived?'checked':'')+' /> Mostrar arquivados</label>' +

        var matchesSearch = !filters.condoSearch || c.nome.toLowerCase().indexOf(filters.condoSearch.toLowerCase())>=0;
        return matchesArchive && matchesSearch;
      }).sort(function(a,b){ return (b.ativo-a.ativo) || a.nome.localeCompare(b.nome); });

      var thisMonth = currentMonthKey();

      wrap.innerHTML = (list.length ?
        '<div class="condo-grid">' + list.map(function(c){
          var t = totalsForMonth(thisMonth, c.id);
          return '<button class="condo-card" data-open="'+c.id+'">' +
            '<div class="cname">'+esc(c.nome)+ (!c.ativo?'<span class="badge-inactive">Arquivado</span>':'') +'</div>' +
            '<div class="cstat"><span>Recebido (mês)</span><span class="v good num">'+fmtMoney(t.totalIn)+'</span></div>' +
            '<div class="cstat"><span>Gasto (mês)</span><span class="v bad num">'+fmtMoney(t.totalOut)+'</span></div>' +
            '<div class="csaldo num">Saldo do mês: <strong style="color:var(--'+(t.saldo>=0?'good':'bad')+')">'+fmtMoney(t.saldo)+'</strong></div>' +
          '</button>';

      var t = totalsForMonth(key, id);
      var allTx = t.ins.map(function(e){ return Object.assign({tipo:'entrada'}, e); })
        .concat(t.outs.map(function(s){ return Object.assign({tipo:'saida'}, s); }))
        .sort(function(a,b){ return (b.data+b.criadoEm).localeCompare(a.data+a.criadoEm); });

      var trend = [];
      for(var i=5;i>=0;i--){ var k = addMonths(currentMonthKey(), -i); trend.push({k:k, t: totalsForMonth(k, id)}); }
      var maxVal = Math.max.apply(null, trend.map(function(x){ return Math.max(x.t.totalIn, x.t.totalOut); }).concat([1]));

      root.innerHTML =
        '<div class="search-header">' +
          '<button class="back-btn" id="back-condos">←</button>' +
          '<div><h1 style="margin:0;font-size:20px;">'+esc(c.nome)+(!c.ativo?'<span class="badge-inactive">Arquivado</span>':'')+'</h1></div>' +
        '</div>' +
        '<div class="filters-row"><div id="detail-month"></div>' +
          '<button class="btn btn-danger btn-sm" id="del-condo" style="margin-left:auto;">Remover condomínio</button>' +
        '</div>' +
        '<div class="kpi-grid">' +
          '<div class="card kpi good"><div class="kpi-label">⬆️ Recebido</div><div class="kpi-value num">'+fmtMoney(t.totalIn)+'</div></div>' +
          '<div class="card kpi bad"><div class="kpi-label">⬇️ Gasto</div><div class="kpi-value num">'+fmtMoney(t.totalOut)+'</div></div>' +
          '<div class="card kpi '+(t.saldo>=0?'good':'bad')+'"><div class="kpi-label">💰 Saldo</div><div class="kpi-value num">'+fmtMoney(t.saldo)+'</div></div>' +
        '</div>' +
        '<div class="section-title">📈 Últimos 6 meses</div>' +
        '<div class="card pad">' +
          '<div class="trend-bars-wrap">' + trend.map(function(x){
            var hIn = Math.max(3, Math.round((x.t.totalIn/maxVal)*54));
            var hOut = Math.max(3, Math.round((x.t.totalOut/maxVal)*54));
            return '<div class="trend-col">' +
              '<div class="trend-mini">' +
                '<div class="bar" style="height:'+hIn+'px;background:var(--good);" title="Recebido '+fmtMoney(x.t.totalIn)+'"></div>' +
                '<div class="bar" style="height:'+hOut+'px;background:var(--bad);" title="Gasto '+fmtMoney(x.t.totalOut)+'"></div>' +
              '</div>' +
              '<div class="tlabel">'+monthLabelShort(x.k)+'</div>' +

        );

      });
      root.querySelectorAll('[data-att]').forEach(function(btn){
        btn.onclick = function(){ viewComprovante(btn.dataset.att); };
      });

    /* ---------- view: sugestões ---------- */
    function renderSugestoes(root){
      var key = currentMonthKey();
      var prevKey = addMonths(key,-1);
      var t = totalsForMonth(key);
      var tPrev = totalsForMonth(prevKey);
      var cards = [];

      if(state.entradas.length===0 && state.saidas.length===0){
        root.innerHTML =
          '<div class="view-header"><div><h1>💭 Sugestões</h1><p>Insights automáticos sobre a saúde financeira dos seus condomínios.</p></div></div>' +
          '<div class="card empty-state pad"><div class="ic">💭</div><p>Assim que você tiver alguns lançamentos, vou aparecer aqui com dicas sobre o seu financeiro.</p></div>';
        return;
      }

      if(tPrev.totalOut>0){
        var pct = ((t.totalOut - tPrev.totalOut)/tPrev.totalOut)*100;
        if(pct >= 10){
          cards.push({ic:'📈', cls:'warn', title:'Gastos subiram este mês', text:'Você gastou '+fmtMoney(t.totalOut)+' em '+monthLabel(key)+', '+pct.toFixed(0)+'% a mais que em '+monthLabel(prevKey)+' ('+fmtMoney(tPrev.totalOut)+'). Vale revisar onde o gasto aumentou.'});
        } else if(pct <= -10){
          cards.push({ic:'✅', cls:'good', title:'Gastos em queda', text:'Seus gastos caíram '+Math.abs(pct).toFixed(0)+'% em relação a '+monthLabel(prevKey)+'. Continue assim!'});
        }
      }
      if(tPrev.totalIn>0){
        var pctIn = ((t.totalIn - tPrev.totalIn)/tPrev.totalIn)*100;
        if(pctIn <= -10){
          cards.push({ic:'⚠️', cls:'warn', title:'Faturamento em queda', text:'Você recebeu '+pctIn.toFixed(0).replace('-','')+'% a menos que em '+monthLabel(prevKey)+'. Confira se algum contrato mensal ainda não foi lançado ou se algum condomínio reduziu o valor.'});
        }
      }

      var porCondo = activeCondos().map(function(c){ return {c:c, t: totalsForMonth(key, c.id)}; }).filter(function(r){ return r.t.totalOut>0; });
      if(porCondo.length){
        porCondo.sort(function(a,b){ return b.t.totalOut - a.t.totalOut; });
        var top = porCondo[0];
        cards.push({ic:'🏗️', cls:'', title:'Maior gasto do mês: '+top.c.nome, text:'Esse condomínio já custou '+fmtMoney(top.t.totalOut)+' em '+monthLabel(key)+'.'});
      }

      var negativos = activeCondos().map(function(c){ return {c:c, t: totalsForMonth(key, c.id)}; }).filter(function(r){ return (r.t.totalIn>0 || r.t.totalOut>0) && r.t.saldo<0; });
      if(negativos.length){
        cards.push({ic:'🔻', cls:'warn', title: negativos.length===1 ? negativos[0].c.nome+' está no negativo' : negativos.length+' condomínios estão no negativo', text: negativos.map(function(r){ return r.c.nome+' ('+fmtMoney(r.t.saldo)+')'; }).join(', ') + ' neste mês. Vale investigar antes de fechar o mês.'});
      }

      var maiorGasto = t.outs.slice().sort(function(a,b){ return b.valor-a.valor; })[0];
      if(maiorGasto){
        cards.push({ic:'💸', cls:'', title:'Maior despesa individual', text:fmtMoney(maiorGasto.valor)+' em '+condoName(maiorGasto.condominioId)+(maiorGasto.obs?' — "'+esc(maiorGasto.obs)+'"':'')+'.'});
      }

      if(t.saldo>=0){
        cards.push({ic:'💰', cls:'good', title:'Mês positivo', text:'Até agora o lucro de '+monthLabel(key)+' está em '+fmtMoney(t.saldo)+'.'});
      } else {
        cards.push({ic:'🚨', cls:'warn', title:'Mês no vermelho', text:'Até agora '+monthLabel(key)+' está negativo em '+fmtMoney(Math.abs(t.saldo))+'. Vale segurar novas despesas até equilibrar.'});
      }

      root.innerHTML =
        '<div class="view-header"><div><h1>💭 Sugestões</h1><p>Insights automáticos com base nos seus lançamentos.</p></div></div>' +
        '<div class="row-list">' + cards.map(function(cd){
          return '<div class="card insight-card '+cd.cls+'"><div class="ic">'+cd.ic+'</div><div class="txt"><strong>'+esc(cd.title)+'</strong><span>'+cd.text+'</span></div></div>';
        }).join('') + '</div>';
    }

    /* ---------- nav + shell render ---------- */
    function goView(v){ view = v; condoDetailId = null; renderAll(); }

    function renderNav(){
      var desktop = document.getElementById('nav-desktop');
      desktop.innerHTML = NAV_ITEMS.map(function(n){
        return '<button class="nav-item'+(view===n.id?' active':'')+'" data-nav="'+n.id+'"><span class="ic">'+n.ic+'</span>'+n.label+'</button>';
      }).join('');
      desktop.querySelectorAll('[data-nav]').forEach(function(b){ b.onclick=function(){ goView(b.dataset.nav); }; });

      var bottom = document.getElementById('bottom-nav');
      bottom.innerHTML = NAV_ITEMS.map(function(n){
        return '<button class="bn-item'+(view===n.id?' active':'')+'" data-nav="'+n.id+'"><span class="ic">'+n.ic+'</span>'+n.label+'</button>';
      }).join('');
      bottom.querySelectorAll('[data-nav]').forEach(function(b){ b.onclick=function(){ goView(b.dataset.nav); }; });
    }

    function renderAll(){
      renderNav();
      var root = document.getElementById('view-root');
      if(view==='resumo') renderResumo(root);
      else if(view==='dashboard') renderDashboard(root);
      else if(view==='entradas') renderLancamentosView(root,'entrada');
      else if(view==='saidas') renderLancamentosView(root,'saida');
      else if(view==='condominios') renderCondominios(root);
      else if(view==='sugestoes') renderSugestoes(root);
    }

    /* ---------- PWA install ---------- */
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      var btn = document.getElementById('install-btn');
      if(btn) btn.classList.add('show');
    });
    window.triggerInstall = function(){
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function(){
        deferredPrompt = null;
        var btn = document.getElementById('install-btn');
        if(btn) btn.classList.remove('show');
      });
    };

    /* ---------- backup / export (baixa um arquivo .csv com os lançamentos do mês) ---------- */
    function buildMonthBackupCsv(monthKey){
      function csvField(v){
        var s = String(v==null?'':v);
        if(/[";\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
        return s;
      }
      var rows = [['Tipo','Condomínio','Valor','Data','Observação']];
      var all = state.entradas.map(function(e){ return Object.assign({tipo:'Entrada'}, e); })
        .concat(state.saidas.map(function(s){ return Object.assign({tipo:'Saída'}, s); }))
        .filter(function(x){ return monthKeyOf(x.data)===monthKey; })
        .sort(function(a,b){ return a.data.localeCompare(b.data); });
      all.forEach(function(x){
        rows.push([x.tipo, condoName(x.condominioId), String(x.valor).replace('.',','), fmtDateFull(x.data), x.obs||'']);
      });
      var t = totalsForMonth(monthKey);
      rows.push([]);
      rows.push(['Total recebido','', String(t.totalIn).replace('.',',')]);
      rows.push(['Total gasto','', String(t.totalOut).replace('.',',')]);
      rows.push(['Saldo do mês','', String(t.saldo).replace('.',',')]);
      return '﻿' + rows.map(function(r){ return r.map(csvField).join(';'); }).join('\r\n');
    }
    function copyMonthBackup(monthKey){
      var csv = buildMonthBackupCsv(monthKey);
      var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'SOL-Financeiro-' + monthKey + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast('Backup de ' + monthLabel(monthKey) + ' baixado.');
    }

    /* ---------- init ---------- */
    function waitForFirestore(){
      return new Promise(function(resolve){
        if(window.__firestore) return resolve(window.__firestore);
        var iv = setInterval(function(){
          if(window.__firestore){ clearInterval(iv); resolve(window.__firestore); }
        }, 50);
      });
    }

    async function init(){
      var root = document.getElementById('view-root');
      root.innerHTML = '<div class="card empty-state pad" style="margin-top:60px;"><div class="ic">☀️</div><p>Carregando dados...</p></div>';

      var fs = await waitForFirestore();

      try{
        var snap = await fs.getDoc(fs.stateDocRef);
        if(snap.exists()){
          var data = snap.data();
          state.condominios = data.condominios || [];
          state.entradas = data.entradas || [];
          state.saidas = data.saidas || [];
        } else {
          state.condominios = DEFAULT_CONDOMINIOS.map(function(nome, i){ return {id:'c'+(i+1), nome:nome, ativo:true}; });
          state.entradas = [];
          state.saidas = [];
          await fs.setDoc(fs.stateDocRef, state);
        }
      } catch(e){
        console.error('Erro ao carregar Firestore:', e);
        root.innerHTML = '<div class="card empty-state pad" style="margin-top:60px;"><div class="ic">⚠️</div><p>Não foi possível conectar ao banco de dados. Verifique sua internet e recarregue a página.</p></div>';
        return;
      }

      stateLoaded = true;
      renderAll();

      fs.onSnapshot(fs.stateDocRef, function(snap){
        if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
        if(!snap.exists()) return;
        var data = snap.data();
        state.condominios = data.condominios || [];
        state.entradas = data.entradas || [];
        state.saidas = data.saidas || [];
        if(condoDetailId && !state.condominios.some(function(c){ return c.id===condoDetailId; })){ condoDetailId = null; }
        renderAll();
      }, function(err){
        console.error('Erro na sincronização em tempo real:', err);
      });
    }
    init();

  })();
  </script>
</body>
